<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tournament Control — Closest to the Pin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#060c16;
    --night-2:#0a1420;
    --turf:#0d2338;
    --turf-line:#1d3f5c;
    --glow:#ffde59;
    --gold:#f0a83a;
    --gold-dim:#9c6a1e;
    --chalk:#f4f6f8;
    --steel:#7c93b0;
    --steel-dim:#3e5771;
    --live:#ff4438;
    --panel:#0a1a2b;
    --panel-2:#0e2035;
    --border:#1c3b56;
    --font-display:'Anton', sans-serif;
    --font-cond:'Barlow Condensed', sans-serif;
    --font-body:'Barlow', sans-serif;
    --font-mono:'Roboto Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--night); color:var(--chalk); font-family:var(--font-body);
    min-height:100vh;
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
    padding:16px 28px; background:linear-gradient(180deg, rgba(14,32,53,.95), rgba(14,32,53,.75));
    border-bottom:2px solid var(--turf-line);
    position:relative; z-index:1;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:38px; height:auto; flex-shrink:0;
    filter:drop-shadow(0 0 10px rgba(135,210,230,.5));
  }
  .brand-text .l1{font-family:var(--font-cond); font-weight:700; letter-spacing:.14em; font-size:12px; color:var(--glow); text-transform:uppercase;}
  .brand-text .l2{font-family:var(--font-display); font-size:22px; letter-spacing:.03em; color:var(--chalk); text-transform:uppercase;}
  .brand-watermark{
    position:fixed; z-index:0; pointer-events:none;
    right:-4vw; bottom:-6vh; width:34vw; max-width:460px; height:auto;
    opacity:.045; filter:grayscale(.3);
  }
  .wrap{position:relative; z-index:1;}
  .topbar a.live-link{
    font-family:var(--font-cond); font-size:12px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--steel); text-decoration:none; border:1px solid var(--border); padding:9px 14px; border-radius:3px;
    transition:all .15s ease;
  }
  .topbar a.live-link:hover{border-color:var(--glow); color:var(--glow);}

  .wrap{max-width:1000px; margin:0 auto; padding:32px 24px 60px;}

  .control-hero{
    display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
    background:var(--turf); border:1px solid var(--turf-line); border-radius:6px; padding:28px 30px; margin-bottom:36px;
  }
  .control-hero h1{font-family:var(--font-display); font-size:32px; text-transform:uppercase; letter-spacing:.02em; margin-bottom:6px;}
  .control-hero p{font-family:var(--font-cond); color:var(--steel); font-size:14px; letter-spacing:.02em;}
  .new-event-btn{
    font-family:var(--font-cond); font-weight:800; letter-spacing:.08em; text-transform:uppercase;
    font-size:15px; padding:16px 28px; border-radius:4px; border:none; cursor:pointer;
    background:var(--glow); color:#101b0c; text-decoration:none; white-space:nowrap;
    transition:transform .1s ease, opacity .15s ease; display:inline-block;
  }
  .new-event-btn:hover{opacity:.9;}
  .new-event-btn:active{transform:scale(.97);}

  .section-title{
    font-family:var(--font-cond); font-size:14px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--glow); margin-bottom:16px; padding-bottom:10px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
  }
  .history-count{
    background:var(--night-2); border:1px solid var(--border); color:var(--steel);
    font-size:11px; padding:3px 9px; border-radius:20px; letter-spacing:.04em; font-family:var(--font-body); font-weight:600;
  }

  .empty-state{
    text-align:center; padding:50px 20px; color:var(--steel); font-family:var(--font-cond);
    letter-spacing:.04em; font-size:14px; border:1px dashed var(--border); border-radius:6px;
  }
  .empty-state.loading{border:none; display:flex; flex-direction:column; align-items:center; gap:14px;}
  .empty-state.loading img{width:56px; height:auto; animation:pineappleBounce 1.1s ease-in-out infinite; filter:drop-shadow(0 0 14px rgba(135,210,230,.5));}
  @keyframes pineappleBounce{
    0%,100%{ transform:translateY(0) scale(1); }
    50%{ transform:translateY(-10px) scale(1.04); }
  }

  .event-card{
    background:var(--panel); border:1px solid var(--border); border-radius:6px; margin-bottom:14px; overflow:hidden;
  }
  .event-card-head{
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    padding:16px 20px; cursor:pointer;
  }
  .ech-left{display:flex; align-items:center; gap:14px; min-width:0;}
  .ech-trophy{width:34px; height:34px; flex-shrink:0;}
  .ech-info{min-width:0;}
  .ech-champion{font-family:var(--font-display); font-size:20px; color:var(--gold); text-transform:uppercase; letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ech-meta{font-family:var(--font-cond); font-size:12px; color:var(--steel); letter-spacing:.04em; margin-top:2px;}
  .ech-right{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .ech-date{font-family:var(--font-mono); font-size:12px; color:var(--steel-dim); white-space:nowrap;}
  .ech-toggle{
    font-family:var(--font-cond); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--glow);
    border:1px solid var(--border); padding:6px 12px; border-radius:3px; background:transparent; cursor:pointer;
  }
  .ech-delete{
    font-family:var(--font-cond); font-size:11px; color:var(--steel-dim); background:transparent; border:1px solid var(--border);
    padding:6px 10px; border-radius:3px; cursor:pointer;
  }
  .ech-delete:hover{border-color:var(--live); color:var(--live);}

  .event-card-body{display:none; padding:0 20px 20px; border-top:1px solid var(--border);}
  .event-card.open .event-card-body{display:block;}
  .event-card.open .ech-toggle{color:var(--gold);}

  .recap-shots{margin:16px 0; display:flex; flex-direction:column; gap:6px; max-width:420px;}
  .recap-shots-title{font-family:var(--font-cond); font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--steel); margin-bottom:2px;}
  .recap-shot-row{display:flex; align-items:center; gap:10px; font-size:14px; font-weight:700;}
  .recap-shot-row .rs-rank{font-family:var(--font-display); font-size:16px; color:var(--gold); width:20px;}
  .recap-shot-row .rs-name{flex:1;}
  .recap-shot-row .rs-dist{font-family:var(--font-mono); color:var(--glow);}

  .player-records-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:10px; margin-top:10px;
  }
  .player-record-card{background:var(--night-2); border:1px solid var(--border); border-radius:6px; padding:10px 14px;}
  .prc-name{font-family:var(--font-cond); font-weight:700; font-size:13px; color:var(--chalk); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; border-bottom:1px solid rgba(255,255,255,.08); padding-bottom:5px;}
  .prc-row{display:flex; align-items:center; gap:8px; font-size:11.5px; padding:3px 0; color:var(--steel); border-bottom:1px solid rgba(255,255,255,.04);}
  .prc-row:last-child{border-bottom:none;}
  .prc-round-opp{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .prc-row.bye .prc-round-opp{font-style:italic; color:var(--steel-dim);}
  .prc-badge{font-family:var(--font-cond); font-weight:800; font-size:10px; padding:1px 6px; border-radius:3px; flex-shrink:0;}
  .prc-row.win .prc-badge{background:var(--glow); color:#101b0c;}
  .prc-row.loss .prc-badge{background:var(--steel-dim); color:var(--night);}
  .prc-dist{font-family:var(--font-mono); font-weight:700; color:var(--chalk); flex-shrink:0; font-size:11px;}

  .status-line{font-family:var(--font-cond); font-size:12px; color:var(--steel); margin-top:10px;}

  @media (max-width: 640px){
    .wrap{padding:20px 16px 40px;}
    .control-hero{padding:22px 20px; flex-direction:column; align-items:flex-start;}
    .new-event-btn{width:100%; text-align:center;}
  }
</style>
</head>
<body>

  <img class="brand-watermark" src="/brand/pineapple.png" alt="" aria-hidden="true">

  <div class="topbar">
    <div class="brand">
      <img class="brand-mark" src="/brand/pineapple.png" alt="Atlantic Fields">
      <div class="brand-text">
        <div class="l1">Atlantic Fields</div>
        <div class="l2">Tournament Control</div>
      </div>
    </div>
    <a class="live-link" href="/">Open Live Display →</a>
  </div>

  <div class="wrap">
    <div class="control-hero">
      <div>
        <h1>Ready for tonight?</h1>
        <p>Start a new event, then set up players from the admin panel.</p>
      </div>
      <a class="new-event-btn" href="/?new=1">+ New Event</a>
    </div>

    <div class="section-title">Event History <span class="history-count" id="history-count">—</span></div>
    <div id="history-list">
      <div class="empty-state loading"><img src="/brand/pineapple.png" alt="">Loading…</div>
    </div>
  </div>

<script>
(function(){
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function fmtDist(d){
    if(!d) return '—';
    const feet = d.feet||0, inches = d.inches||0;
    if(feet === 0) return inches + '"';
    return feet + "' " + inches + '"';
  }
  function distInches(d){ return (d && (d.feet||0)*12 + (d.inches||0)) || 0; }
  function fmtSavedDate(ts){
    if(!ts) return '';
    const d = new Date(ts);
    return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
  }
  function roundLabel(index, total){
    const fromEnd = total - index;
    if(fromEnd === 1) return 'Final';
    if(fromEnd === 2) return 'Semifinals';
    if(fromEnd === 3) return 'Quarterfinals';
    return 'Round ' + (index+1);
  }

  function getTopShots(event, n){
    const shots = [];
    if(event.bracket){
      event.bracket.rounds.forEach(round => round.forEach(m => {
        if(m.bye) return;
        if(m.p1 && m.d1) shots.push({name: m.p1.name, dist: m.d1});
        if(m.p2 && m.d2) shots.push({name: m.p2.name, dist: m.d2});
      }));
    }
    shots.sort((a,b) => distInches(a.dist) - distInches(b.dist));
    return shots.slice(0, n);
  }

  function getPlayerRecords(event){
    if(!event.bracket) return [];
    const totalRounds = event.bracket.rounds.length;
    const map = {};
    function ensure(p){
      if(!map[p.id]) map[p.id] = {id:p.id, name:p.name, entries:[]};
      return map[p.id];
    }
    event.bracket.rounds.forEach((round, ri) => {
      const label = roundLabel(ri, totalRounds);
      round.forEach(m => {
        if(m.bye){
          if(m.winner) ensure(m.winner).entries.push({round:label, opponent:null, dist:null, result:'bye'});
          return;
        }
        if(!m.p1 || !m.p2 || !m.winner) return;
        const p1won = m.winner.id === m.p1.id;
        ensure(m.p1).entries.push({round:label, opponent:m.p2.name, dist:m.d1, result:p1won?'win':'loss'});
        ensure(m.p2).entries.push({round:label, opponent:m.p1.name, dist:m.d2, result:!p1won?'win':'loss'});
      });
    });
    return Object.values(map).sort((a,b) => a.name.localeCompare(b.name));
  }

  function renderEventCard(event){
    const shots = getTopShots(event, 3);
    const records = getPlayerRecords(event);
    const holeLabel = event.hole && (event.hole.label || (event.hole.num ? ('Hole ' + event.hole.num) : ''));

    const shotsHtml = shots.length ? (
      '<div class="recap-shots"><div class="recap-shots-title">Closest Shots</div>' +
      shots.map((s,i) => '<div class="recap-shot-row"><span class="rs-rank">'+(i+1)+'</span><span class="rs-name">'+escapeHtml(s.name)+'</span><span class="rs-dist">'+fmtDist(s.dist)+'</span></div>').join('') +
      '</div>'
    ) : '';

    const recordsHtml = records.length ? (
      '<div class="recap-shots-title" style="margin-top:6px;">Every Player</div>' +
      '<div class="player-records-grid">' +
      records.map(r => {
        const rows = r.entries.map(e => {
          if(e.result === 'bye'){
            return '<div class="prc-row bye"><span class="prc-round-opp">'+escapeHtml(e.round)+'</span><span class="prc-badge">BYE</span><span class="prc-dist">—</span></div>';
          }
          const badge = e.result === 'win' ? 'W' : 'L';
          return '<div class="prc-row '+e.result+'"><span class="prc-round-opp">'+escapeHtml(e.round)+' vs '+escapeHtml(e.opponent)+'</span><span class="prc-badge">'+badge+'</span><span class="prc-dist">'+fmtDist(e.dist)+'</span></div>';
        }).join('');
        return '<div class="player-record-card"><div class="prc-name">'+escapeHtml(r.name)+'</div>'+rows+'</div>';
      }).join('') +
      '</div>'
    ) : '';

    const card = document.createElement('div');
    card.className = 'event-card';
    card.innerHTML =
      '<div class="event-card-head">' +
        '<div class="ech-left">' +
          '<svg class="ech-trophy" viewBox="0 0 24 24" fill="none"><path d="M6 3h12v3a6 6 0 0 1-12 0V3z" stroke="#f0a83a" stroke-width="1.4"/><path d="M6 4H3v2a4 4 0 0 0 4 4M18 4h3v2a4 4 0 0 1-4 4" stroke="#f0a83a" stroke-width="1.4"/><path d="M12 12v4M9 20h6M9 20l1-4h4l1 4" stroke="#f0a83a" stroke-width="1.4" stroke-linecap="round"/></svg>' +
          '<div class="ech-info">' +
            '<div class="ech-champion">' + escapeHtml(event.champion ? event.champion.name : 'Unknown') + '</div>' +
            '<div class="ech-meta">' + escapeHtml(event.eventName || 'Night Golf Event') + (holeLabel ? ' · ' + escapeHtml(holeLabel) : '') + ' · ' + (event.players ? event.players.length : 0) + ' players</div>' +
          '</div>' +
        '</div>' +
        '<div class="ech-right">' +
          '<span class="ech-date">' + fmtSavedDate(event.savedAt) + '</span>' +
          '<button class="ech-toggle">View Recap</button>' +
          '<button class="ech-delete" title="Delete this event">✕</button>' +
        '</div>' +
      '</div>' +
      '<div class="event-card-body">' + shotsHtml + recordsHtml + '</div>';

    card.querySelector('.event-card-head').addEventListener('click', (e) => {
      if(e.target.closest('.ech-delete')) return;
      card.classList.toggle('open');
      card.querySelector('.ech-toggle').textContent = card.classList.contains('open') ? 'Hide Recap' : 'View Recap';
    });
    card.querySelector('.ech-delete').addEventListener('click', async (e) => {
      e.stopPropagation();
      if(!confirm('Delete this event from history? This can\'t be undone.')) return;
      try{
        await fetch('/api/history/' + encodeURIComponent(event.id), { method:'DELETE' });
        card.remove();
        loadHistory(); // refresh the count
      }catch(err){
        alert('Failed to delete — check your connection and try again.');
      }
    });

    return card;
  }

  async function loadHistory(){
    const list = document.getElementById('history-list');
    const countEl = document.getElementById('history-count');
    try{
      const res = await fetch('/api/history', { cache:'no-store' });
      const data = await res.json();
      const events = (data && data.events) || [];
      countEl.textContent = events.length + (events.length === 1 ? ' event' : ' events');
      if(!events.length){
        list.innerHTML = '<div class="empty-state">No tournaments saved yet — finish an event and it\'ll show up here.</div>';
        return;
      }
      list.innerHTML = '';
      events.forEach(ev => list.appendChild(renderEventCard(ev)));
    }catch(e){
      list.innerHTML = '<div class="empty-state">Couldn\'t load history — check your connection and refresh.</div>';
    }
  }

  loadHistory();
})();
</script>
</body>
</html>
